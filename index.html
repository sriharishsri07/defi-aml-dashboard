<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Assets Alert Monitoring · Live data</title>
<style>
  :root {
    --bg: #0a0f1e; --bg2: #0f1730; --panel: #121b33; --panel2: #162040; --line: rgba(255,255,255,.07);
    --text: #e8edf8; --muted: #8e9bb8; --faint: #5d6b8a;
    --accent: #7aa7ff; --violet: #9b8cff;
    --red: #ff6b7a; --orange: #ffa45c; --yellow: #f6c85f; --green: #4fd1a1; --blue: #62b0ff; --grey: #8e9bb8;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--sans); color: var(--text); background:
      radial-gradient(1200px 600px at 12% -10%, rgba(122,167,255,.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(155,140,255,.12), transparent 55%), var(--bg);
    min-height: 100vh; font-size: 14px; line-height: 1.5; }
  header { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(14px); background: rgba(10,15,30,.78);
    border-bottom: 1px solid var(--line); }
  .bar { max-width: 1680px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 18px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--violet));
    display: grid; place-items: center; font-weight: 800; color: #0a0f1e; letter-spacing: -.5px; box-shadow: 0 6px 24px rgba(122,167,255,.35); }
  .title h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .1px; }
  .title p { margin: 0; color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .stamp { color: var(--muted); font-size: 12px; text-align: right; }
  .stamp b { color: var(--text); font-weight: 600; }
  select, button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button.primary { background: linear-gradient(135deg, #5f8ff0, #8b7cf6); border: 0; font-weight: 600; color: #fff; display: inline-flex; gap: 8px; align-items: center; box-shadow: 0 6px 20px rgba(110,130,240,.35); }
  button.primary:disabled { opacity: .7; cursor: progress; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: sp .8s linear infinite; display: none; }
  .loading .spin { display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .wrap { max-width: 1680px; margin: 0 auto; padding: 24px 28px 80px; display: grid; grid-template-columns: 230px 1fr; gap: 28px; }
  nav { position: sticky; top: 86px; align-self: start; max-height: calc(100vh - 110px); overflow: auto; }
  nav .grp { color: var(--faint); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; margin: 18px 10px 6px; }
  nav .grp:first-child { margin-top: 0; }
  nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 9px; color: var(--muted); text-decoration: none; font-size: 13px; }
  nav a:hover { background: rgba(255,255,255,.04); color: var(--text); }
  nav a.on { background: rgba(122,167,255,.12); color: var(--text); }
  nav .n { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  nav .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(79,209,161,.18); display: inline-block; margin-right: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .kpi { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; position: relative; overflow: hidden; }
  .kpi::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c, var(--accent)); }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .kpi .v { font-size: 28px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  section.block { margin-bottom: 30px; scroll-margin-top: 90px; }
  .gh { display: flex; align-items: center; gap: 12px; margin: 34px 0 14px; }
  .gh h2 { margin: 0; font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--accent); font-weight: 650; }
  .gh .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  details.card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.28); margin-bottom: 18px; }
  details.card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
  details.card > summary::-webkit-details-marker { display: none; }
  .chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .2s; margin-right: 2px; }
  details[open] > summary .chev { transform: rotate(45deg); }
  .ct { flex: 1; min-width: 0; }
  .ct h3 { margin: 0; font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ct p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .tkey { font-family: var(--mono); font-size: 11px; color: var(--faint); background: rgba(255,255,255,.04); border-radius: 6px; padding: 2px 7px; }
  .cnt { font-size: 12px; color: var(--muted); background: rgba(255,255,255,.05); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .upd { font-size: 11px; font-weight: 700; color: #07261a; background: var(--green); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .scroll { overflow: auto; border-top: 1px solid var(--line); max-height: 560px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  th { position: sticky; top: 0; z-index: 2; text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); background: #131d38; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.045); vertical-align: top; }
  th.r, td.r { text-align: right; }
  td:first-child { white-space: nowrap; }
  .scroll > table > thead > tr > th:first-child, .scroll > table > tbody > tr:not(.detail) > td:first-child { position: sticky; left: 0; }
  .scroll > table > tbody > tr:not(.detail) > td:first-child { z-index: 1; background: #141d38; box-shadow: 1px 0 0 var(--line); }
  .scroll > table > thead > tr > th:first-child { z-index: 4; }
  tbody tr:hover td:first-child { background: #19243f; }
  tr.chg td:first-child { background: #17322f; box-shadow: inset 3px 0 0 var(--green), 1px 0 0 var(--line); }
  .hex { display: block; font-family: var(--mono); font-size: 12px; line-height: 1.55; color: #b9c6e6; white-space: normal; overflow-wrap: anywhere; word-break: break-all; cursor: copy; }
  .hex.hash { width: 36ch; }
  .hex.addr { width: 24ch; }
  .hex:hover { color: var(--accent); }
  .txt { min-width: 260px; max-width: 460px; white-space: normal; line-height: 1.5; overflow-wrap: break-word; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .idc { font-family: var(--mono); font-size: 12px; color: #b9c6e6; white-space: nowrap; }
  tbody tr:hover td { background: rgba(255,255,255,.025); }
  tr.chg td { background: rgba(79,209,161,.075); }
  tr.chg td:first-child { box-shadow: inset 3px 0 0 var(--green); }
  tr.click { cursor: pointer; }
  .mono { font-family: var(--mono); font-size: 12px; color: #b9c6e6; }
  .nul { color: var(--faint); }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .clamp.open { -webkit-line-clamp: unset; display: block; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); display: inline-block; }
  .code { font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff; background: rgba(155,140,255,.22); border: 1px solid rgba(155,140,255,.4); border-radius: 7px; padding: 2px 8px; }
  .risk { display: flex; align-items: center; gap: 10px; min-width: 150px; }
  .risk .t { height: 7px; flex: 1; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .risk .t b { display: block; height: 100%; border-radius: 99px; background: var(--c); }
  .risk span { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
  .sub { color: var(--muted); font-size: 12px; }
  tr.detail td { background: rgba(0,0,0,.18); padding: 0; }
  .dgrid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; padding: 20px 24px 24px; }
  .dgrid h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .action { grid-column: 1 / -1; border-radius: 14px; padding: 14px 18px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 13%, transparent); }
  .action h4 { color: var(--c); }
  .action p { margin: 0; font-size: 15px; font-weight: 600; color: var(--c); }
  .dgrid ul { margin: 0; padding-left: 18px; color: #c9d3ec; }
  .dgrid li { margin: 3px 0; }
  .dgrid p { margin: 0; color: #c9d3ec; }
  .empty { padding: 26px; text-align: center; color: var(--faint); }
  .err { margin: 40px auto; max-width: 720px; background: rgba(255,107,122,.08); border: 1px solid rgba(255,107,122,.35); border-radius: 16px; padding: 22px 26px; }
  .err h3 { margin: 0 0 8px; color: var(--red); }
  .err code { font-family: var(--mono); background: rgba(255,255,255,.07); padding: 1px 6px; border-radius: 5px; }
  .skeleton { height: 90px; border-radius: 16px; margin-bottom: 18px; background: linear-gradient(90deg, var(--panel), var(--panel2), var(--panel)); background-size: 200% 100%; animation: sh 1.4s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } nav { display: none; } .dgrid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">DA</div>
    <div class="title"><h1>Digital Assets Alert Monitoring</h1><p>Live data behind the demo · every table the agents read and write</p></div>
    <div class="spacer"></div>
    <div class="stamp" id="stamp">Not loaded yet</div>
    <select id="auto" title="Auto refresh">
      <option value="0">Auto refresh: off</option>
      <option value="10">Every 10 s</option>
      <option value="30">Every 30 s</option>
      <option value="60">Every 60 s</option>
    </select>
    <button class="primary" id="btn"><span class="spin"></span><span>Refresh</span></button>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var SNAP_KEY = 'abl-da-demo-snapshot-v1';
  var timer = null, lastTables = [];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nul() { return '<span class="nul">—</span>'; }
  var LABELS = { tx_hash: 'Tx hash', usd_value: 'USD value', client_id: 'Client ID', wallet_id: 'Wallet', alert_type: 'Alert type', fc_ofac_sdn: 'OFAC SDN' };
  function label(c) { if (LABELS[c]) return LABELS[c]; return c.replace(/_/g, ' ').replace(/\b\w/g, function (m) { return m.toUpperCase(); }).replace(/\bId\b/g, 'ID').replace(/\bUsd\b/g, 'USD').replace(/\bPct\b/g, '%').replace(/\bTx\b/g, 'Tx').replace(/\bApi\b/g, 'API'); }
  function color(name) { return { red: 'var(--red)', orange: 'var(--orange)', yellow: 'var(--yellow)', green: 'var(--green)', blue: 'var(--blue)', grey: 'var(--grey)', violet: 'var(--violet)' }[name] || 'var(--grey)'; }
  function pill(text, c) { return '<span class="pill" style="--c:' + color(c) + '"><i></i>' + esc(text) + '</span>'; }
  var STATUS = { pending: ['Pending', 'grey'], in_progress: ['In progress', 'blue'], escalated: ['Escalated', 'orange'], approved: ['Approved / closed', 'green'], rejected: ['Rejected', 'red'], failed: ['Failed', 'red'] };
  var STATUS_COLS = { status: 1, severity: 1, family: 1, disposition_code: 1 };
  var SEV = { P1: ['P1 · Critical', 'red'], P2: ['P2 · High', 'orange'], P3: ['P3 · Medium', 'yellow'], P4: ['P4 · Low', 'green'] };
  var FAM = { financial_crime: ['Financial Crime', 'violet'], security: ['Security', 'blue'], network_ledger: ['Network & Ledger', 'green'] };
  function sevColor(s) { return (SEV[s] || [0, 'grey'])[1]; }
  function riskColor(n) { return n >= 75 ? 'red' : n >= 50 ? 'orange' : n >= 25 ? 'yellow' : 'green'; }

  function fmtDate(v) {
    var d = new Date(v);
    if (isNaN(d)) return esc(v);
    return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC';
  }
  function ago(v) {
    var s = Math.max(0, (Date.now() - new Date(v).getTime()) / 1000);
    if (isNaN(s)) return '';
    if (s < 60) return Math.round(s) + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }

  function cell(col, v, row) {
    if (v == null || v === '') return nul();
    if (col === 'status' && STATUS[v]) return pill(STATUS[v][0], STATUS[v][1]);
    if (col === 'severity' && SEV[v]) return pill(SEV[v][0], SEV[v][1]);
    if (col === 'family' && FAM[v]) return pill(FAM[v][0], FAM[v][1]);
    if (col === 'disposition_code') return '<span class="code">' + esc(v) + '</span>';
    if (col === 'transaction_id') return '<b>' + esc(v) + '</b>';
    if (col === 'risk_score') { var n = Number(v); return '<div class="risk" style="--c:' + color(riskColor(n)) + '"><div class="t"><b style="width:' + n + '%"></b></div><span>' + n + '</span></div>'; }
    if (typeof v === 'boolean') return pill(v ? 'Yes' : 'No', v ? 'blue' : 'grey');
    if (typeof v === 'number') {
      var s = v.toLocaleString('en-US', { maximumFractionDigits: 4 });
      if (/usd/.test(col)) s = '$' + s; else if (/pct|share/.test(col)) s += '%';
      return '<span class="num">' + s + '</span>';
    }
    var str = String(v);
    if (/^0x[0-9a-fA-F]{60,}$/.test(str)) return '<span class="hex hash" title="Click to copy" data-copy="' + esc(str) + '">' + esc(str) + '</span>';
    if (/^0x[0-9a-fA-F]{30,}$/.test(str) || (/^(bc1|T[1-9A-HJ-NP-Za-km-z]{30,})/.test(str) && str.length > 30)) return '<span class="hex addr" title="Click to copy" data-copy="' + esc(str) + '">' + esc(str) + '</span>';
    if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$/.test(str)) return '<span class="sub" style="white-space:nowrap">' + fmtDate(str) + '</span>';
    if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(str)) return '<span style="white-space:nowrap">' + esc(str) + '</span>';
    if (/_id$/.test(col) && str.length <= 24) return '<span class="idc">' + esc(str) + '</span>';
    if (str.length > 48) return '<div class="txt">' + esc(str) + '</div>';
    return esc(str);
  }

  function snapshotCompare(tables) {
    var prev = {};
    try { prev = JSON.parse(localStorage.getItem(SNAP_KEY) || '{}'); } catch (e) { prev = {}; }
    var next = {}, haveBaseline = Object.keys(prev).length > 0;
    tables.forEach(function (t) {
      next[t.key] = {};
      t.changed = 0;
      t.rows.forEach(function (r) {
        next[t.key][r.id] = r.version;
        var was = prev[t.key] && prev[t.key][r.id];
        r.changed = haveBaseline && was !== r.version;
        if (r.changed) t.changed++;
      });
      if (haveBaseline && prev[t.key]) {
        Object.keys(prev[t.key]).forEach(function (id) { if (!(id in next[t.key])) t.changed++; });
      }
    });
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(next)); } catch (e) {}
  }

  function genericTable(t) {
    if (!t.rows.length) return '<div class="empty">No rows in this table yet.</div>';
    var cols = t.columns.filter(function (c) { return c !== 'created_at' || t.key !== 'alert_cases'; });
    var numeric = {}, tagged = {};
    cols.forEach(function (c) {
      var vals = t.rows.map(function (r) { return r.values[c]; }).filter(function (v) { return v != null && v !== ''; });
      if (!vals.length) return;
      if (vals.every(function (v) { return typeof v === 'number'; })) { numeric[c] = true; return; }
      var distinct = {}; vals.forEach(function (v) { distinct[String(v)] = 1; });
      var n = Object.keys(distinct).length;
      if (t.rows.length >= 3 && n <= 6 && n < vals.length && !STATUS_COLS[c] &&
          vals.every(function (v) { return typeof v === 'string' && v.length <= 28; }) &&
          !/(^transaction_id$|_id$|name|address|hash|date|time|notes|label|entity|window|basis|description|reason)/.test(c)) tagged[c] = true;
    });
    var TAGC = ['blue', 'violet', 'green', 'yellow', 'orange'];
    function tagFor(c, v) {
      var s = String(v), k = { inbound: 'green', outbound: 'orange', true: 'blue', false: 'grey' }[s.toLowerCase()];
      if (!k) { var sum = 0; for (var i = 0; i < s.length; i++) sum += s.charCodeAt(i); k = TAGC[sum % TAGC.length]; }
      return '<span class="tag" style="--c:' + color(k) + '">' + esc(s) + '</span>';
    }
    var h = '<div class="scroll"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (numeric[c] ? 'r' : '') + '">' + esc(label(c)) + '</th>'; }).join('') + '<th>Updated</th></tr></thead><tbody>';
    t.rows.forEach(function (r) {
      h += '<tr class="' + (r.changed ? 'chg' : '') + '">' + cols.map(function (c) {
        var v = r.values[c];
        var inner = (tagged[c] && typeof v === 'string' && v !== '') ? tagFor(c, v) : cell(c, v, r);
        return '<td class="' + (numeric[c] ? 'r' : '') + '">' + inner + '</td>';
      }).join('') + '<td class="sub" style="white-space:nowrap">' + esc(ago(r.updatedAt)) + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  function index(tables, key) { var m = {}; var t = tables.filter(function (x) { return x.key === key; })[0]; (t ? t.rows : []).forEach(function (r) { m[r.values.transaction_id] = r.values; }); return m; }

  function outcomeTable(t, all) {
    var tx = index(all, 'da_transactions'), ctx = index(all, 'alert_context'), rk = index(all, 'case_risk');
    if (!t.rows.length) return '<div class="empty">No cases yet.</div>';
    var h = '<div class="scroll" style="max-height:none"><table><thead><tr><th></th><th>Transaction</th><th>Client</th><th>Alert type</th><th>Family</th><th>Status</th><th>Severity</th><th>Disposition</th><th>Risk score</th><th>Handled by</th><th>Updated</th></tr></thead><tbody>';
    t.rows.forEach(function (r, i) {
      var v = r.values, id = v.transaction_id, x = tx[id] || {}, c = ctx[id] || {}, k = rk[id] || {};
      var pending = v.status === 'pending';
      h += '<tr class="click ' + (r.changed ? 'chg' : '') + '" data-detail="d' + i + '">' +
        '<td><span class="chev"></span></td>' +
        '<td><b>' + esc(id) + '</b></td>' +
        '<td>' + esc(x.client_name || '') + '<div class="sub">' + (x.usd_value != null ? '$' + Number(x.usd_value).toLocaleString('en-US') : '') + '</div></td>' +
        '<td>' + esc((c.alert_type || '').replace(/_/g, ' ')) + '</td>' +
        '<td>' + (v.family ? cell('family', v.family) : nul()) + '</td>' +
        '<td>' + cell('status', v.status) + '</td>' +
        '<td>' + (v.severity ? cell('severity', v.severity) : nul()) + '</td>' +
        '<td>' + (v.disposition_code ? cell('disposition_code', v.disposition_code) : (v.status === 'escalated' ? '<span class="sub">none · needs judgement</span>' : nul())) + '</td>' +
        '<td>' + (k.risk_score != null ? cell('risk_score', k.risk_score) : nul()) + '</td>' +
        '<td class="sub">' + esc(v.assigned_agent || (pending ? 'waiting' : '')) + '</td>' +
        '<td class="sub">' + esc(ago(r.updatedAt)) + '</td></tr>';
      var sc = sevColor(v.severity);
      var lines = String(v.checks_performed || '').split('\n').filter(Boolean);
      var qs = String(v.open_questions || '').split(';').map(function (s) { return s.trim(); }).filter(Boolean);
      h += '<tr class="detail" id="d' + i + '" style="display:none"><td colspan="11"><div class="dgrid">' +
        (v.action_recommendation ? '<div class="action" style="--c:' + color(sc) + '"><h4>Recommended action</h4><p>' + esc(v.action_recommendation) + '</p></div>' : '') +
        '<div><h4>Reasoning</h4><p>' + (v.reasoning ? esc(v.reasoning) : nul()) + '</p>' +
        (qs.length ? '<h4 style="margin-top:14px">Open questions</h4><ul>' + qs.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul>' : '') +
        (k.risk_basis ? '<h4 style="margin-top:14px">Risk basis · ' + esc(k.risk_rating || '') + '</h4><p>' + esc(k.risk_basis) + '</p>' : '') + '</div>' +
        '<div><h4>Checks performed</h4>' + (lines.length ? '<ul>' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' : nul()) +
        (v.classification_reasoning ? '<h4 style="margin-top:14px">First-line classification</h4><p>' + esc(v.classification_reasoning) + '</p>' : '') +
        (v.reviewed_by || v.reviewer_notes ? '<h4 style="margin-top:14px">Human review</h4><p>' + esc(v.reviewer_notes || '') + '<span class="sub"> ' + esc(v.reviewed_by || '') + (v.human_approval_reference ? ' · ' + esc(v.human_approval_reference) : '') + '</span></p>' : '') +
        '</div></div></td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  function card(t, all, opts) {
    opts = opts || {};
    var body = t.key === 'alert_cases' ? outcomeTable(t, all) : genericTable(t);
    return '<details class="card" id="t-' + t.key + '" ' + (opts.closed ? '' : 'open') + '><summary><span class="chev"></span><div class="ct"><h3>' + esc(t.title) + ' <span class="tkey">' + esc(t.key) + '</span></h3><p>' + esc(t.description) + '</p></div>' +
      (t.changed ? '<span class="upd">' + t.changed + ' updated</span>' : '') + '<span class="cnt">' + t.rows.length + (t.rows.length === 1 ? ' row' : ' rows') + '</span></summary>' + body + '</details>';
  }

  function kpis(all) {
    var cases = (all.filter(function (t) { return t.key === 'alert_cases'; })[0] || { rows: [] }).rows.map(function (r) { return r.values; });
    var risks = (all.filter(function (t) { return t.key === 'case_risk'; })[0] || { rows: [] }).rows.map(function (r) { return r.values.risk_score; }).filter(function (n) { return n != null; });
    var by = function (s) { return cases.filter(function (c) { return c.status === s; }).length; };
    var items = [['Transactions', cases.length, 'blue'], ['Pending', by('pending'), 'grey'], ['Escalated', by('escalated'), 'orange'], ['Closed by agents', by('approved'), 'green'], ['Rejected / failed', by('rejected') + by('failed'), 'red'], ['Highest risk score', risks.length ? Math.max.apply(null, risks) : '—', 'violet']];
    return '<div class="kpis">' + items.map(function (i) { return '<div class="kpi" style="--c:' + color(i[2]) + '"><div class="l">' + i[0] + '</div><div class="v">' + i[1] + '</div></div>'; }).join('') + '</div>';
  }

  function render(payload) {
    var all = payload.tables;
    snapshotCompare(all);
    lastTables = all;
    var get = function (k) { return all.filter(function (t) { return t.key === k; })[0]; };
    var html = kpis(all);
    html += '<div class="gh"><h2>Transactions</h2><div class="rule"></div></div>' + card(get('da_transactions'), all);
    html += '<div class="gh"><h2>Outcome</h2><div class="rule"></div></div>' + card(get('alert_cases'), all) + card(get('case_risk'), all, { closed: true });
    html += '<div class="gh"><h2>Classification input</h2><div class="rule"></div></div>' + card(get('alert_context'), all, { closed: true });
    ['Financial Crime', 'Security', 'Network & Ledger'].forEach(function (g) {
      html += '<div class="gh"><h2>' + esc(g) + ' · scenario tables</h2><div class="rule"></div></div>';
      all.filter(function (t) { return t.group === g; }).forEach(function (t) { html += card(t, all, { closed: true }); });
    });
    $('#main').innerHTML = html;

    var nav = '<div class="grp">Overview</div>';
    var link = function (t) { return '<a href="#t-' + t.key + '"><span>' + (t.changed ? '<span class="dot"></span>' : '') + esc(t.title) + '</span><span class="n">' + t.rows.length + '</span></a>'; };
    nav += link(get('da_transactions')) + '<div class="grp">Outcome</div>' + link(get('alert_cases')) + link(get('case_risk')) + '<div class="grp">Classification</div>' + link(get('alert_context'));
    ['Financial Crime', 'Security', 'Network & Ledger'].forEach(function (g) { nav += '<div class="grp">' + esc(g) + '</div>' + all.filter(function (t) { return t.group === g; }).map(link).join(''); });
    $('#nav').innerHTML = nav;
    $('#stamp').innerHTML = 'Refreshed <b>' + new Date().toLocaleTimeString('en-GB') + '</b><br>Data read ' + esc(fmtDate(payload.generatedAt));
  }

  function showError(msg) {
    $('#main').innerHTML = '<div class="err"><h3>Could not load the data</h3><p>' + esc(msg) + '</p><p class="sub">Check that <code>.env</code> contains a valid <code>ABL_API_KEY</code> and that the server is running (<code>node server.js</code>).</p></div>';
  }

  function load() {
    var b = $('#btn'); b.disabled = true; document.body.classList.add('loading');
    fetch('/api/data', { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); })
      .then(render).catch(function (e) { showError(e.message); })
      .then(function () { b.disabled = false; document.body.classList.remove('loading'); });
  }

  document.addEventListener('click', function (e) {
    var rowEl = e.target.closest('tr[data-detail]');
    if (rowEl) { var d = document.getElementById(rowEl.getAttribute('data-detail')); var open = d.style.display !== 'none'; d.style.display = open ? 'none' : 'table-row'; var ch = rowEl.querySelector('.chev'); if (ch) ch.style.transform = open ? 'rotate(-45deg)' : 'rotate(45deg)'; return; }
    var cl = e.target.closest('[data-clamp]'); if (cl) { cl.classList.toggle('open'); return; }
    var cp = e.target.closest('[data-copy]'); if (cp && navigator.clipboard) { navigator.clipboard.writeText(cp.getAttribute('data-copy')); cp.style.color = 'var(--green)'; setTimeout(function () { cp.style.color = ''; }, 700); }
  });
  $('#btn').addEventListener('click', load);
  $('#auto').addEventListener('change', function () { clearInterval(timer); var s = Number(this.value); if (s) timer = setInterval(load, s * 1000); });
  load();
})();
</script>
</body>
</html>
